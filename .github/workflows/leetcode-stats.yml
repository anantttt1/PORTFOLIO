name: Update LeetCode stats

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:            # run it by hand from the Actions tab
  push:
    paths:
      - ".github/workflows/leetcode-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats from LeetCode
        env:
          LC_USER: Anant_goyal2907
        run: |
          curl -sS --fail -X POST https://leetcode.com/graphql \
            -H "Content-Type: application/json" \
            -H "Referer: https://leetcode.com/u/${LC_USER}/" \
            -H "User-Agent: Mozilla/5.0" \
            --data "{\"query\":\"query(\$u:String!){matchedUser(username:\$u){submitStatsGlobal{acSubmissionNum{difficulty count}}}}\",\"variables\":{\"u\":\"${LC_USER}\"}}" \
            -o raw.json
          jq -e '.data.matchedUser.submitStatsGlobal.acSubmissionNum' raw.json > /dev/null
          jq '.data.matchedUser.submitStatsGlobal.acSubmissionNum as $a
              | {total: ($a[]|select(.difficulty=="All").count),
                 easy:  ($a[]|select(.difficulty=="Easy").count),
                 medium:($a[]|select(.difficulty=="Medium").count),
                 hard:  ($a[]|select(.difficulty=="Hard").count)}' raw.json > stats.json
          rm raw.json
          cat stats.json

      - name: Commit if numbers changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update LeetCode stats"
            git push
          fi
